output: dist/
releases:
  - name: prod
    jobs:
      - name: release-prod-linux-deb
        package:
          platform: linux
          target: deb
          build_args:
            target: lib/main.dart
            no-tree-shake-icons: true
      - name: release-prod-linux-rpm
        package:
          platform: linux
          target: rpm
          build_args:
            target: lib/main.dart
            no-tree-shake-icons: true

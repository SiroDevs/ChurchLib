# ============================================================
# GITHUB RELEASE
# ============================================================

  release:
    name: Publish GitHub Release
    needs:
      - windows-x64
      - windows-arm64
      - linux
      - macos-x64
      - macos-arm64
      - macos-universal
    if: >
      startsWith(github.ref, 'refs/tags/v') &&
      needs.windows-x64.result == 'success' &&
      needs.windows-arm64.result == 'success' &&
      needs.linux.result == 'success' &&
      needs.macos-x64.result == 'success' &&
      needs.macos-arm64.result == 'success' &&
      needs.macos-universal.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
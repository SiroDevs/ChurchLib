name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.6"   # must be a real Flutter git tag (check `flutter --version`)
  FLUTTER_CHANNEL: stable
  ENTRY: lib/main.dart
  APP_NAME: ChurchLib
  PKG_NAME: churchlib

jobs:

# ============================================================
# WINDOWS
# ============================================================

  windows-x64:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          architecture: x64
          cache: true

      - name: Flutter diagnostics
        shell: pwsh
        run: |
          flutter --version
          flutter doctor -v
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $line = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $version = $line.Split('+')[0]
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Prepare
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter gen-l10n

      - name: Build
        shell: pwsh
        run: |
          flutter build windows --release -t $env:ENTRY --no-tree-shake-icons

      - name: Verify build
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          if (-not (Test-Path $release)) {
            Get-ChildItem build/windows -Recurse -Directory
            throw "Windows x64 Release directory not found"
          }
          Get-ChildItem $release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: Build installers
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $source = "$env:GITHUB_WORKSPACE\build\windows\x64\runner\Release"
          $output = "$env:GITHUB_WORKSPACE\dist"
          New-Item -ItemType Directory -Force $output | Out-Null

          foreach ($mode in @("user", "system")) {
            & $iscc `
              "/DMyAppVersion=$env:VERSION" `
              "/DSourceDir=$source" `
              "/DRepoRoot=$env:GITHUB_WORKSPACE" `
              "/DOutputDir=$output" `
              "/DArch=x64" `
              "/DInstallMode=$mode" `
              "$env:GITHUB_WORKSPACE\windows\packaging\churchlib.iss"
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed for $mode installation" }
          }

      - name: Build ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "dist/${{ env.PKG_NAME }}-windows-x64.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error

  windows-arm64:
    name: Windows arm64
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          architecture: x64
          cache: true

      - name: Bootstrap ARM64 Dart SDK
        shell: pwsh
        run: |
          $flutterRoot = $env:FLUTTER_ROOT
          $stamp = Join-Path $flutterRoot "bin\cache\dart-sdk\revision"
          if (Test-Path $stamp) { Remove-Item $stamp -Force }
          & "$flutterRoot\bin\internal\update_dart_sdk.ps1"

      - name: Flutter diagnostics
        shell: pwsh
        run: |
          flutter --version
          flutter doctor -v
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $line = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $version = $line.Split('+')[0]
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Prepare
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter gen-l10n

      - name: Build
        shell: pwsh
        run: |
          flutter build windows --release -t $env:ENTRY --no-tree-shake-icons

      - name: Verify build
        shell: pwsh
        run: |
          $release = "build/windows/arm64/runner/Release"
          if (-not (Test-Path $release)) {
            Get-ChildItem build/windows -Recurse -Directory
            throw "Windows arm64 Release directory not found"
          }
          Get-ChildItem $release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: Build installers
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $source = "$env:GITHUB_WORKSPACE\build\windows\arm64\runner\Release"
          $output = "$env:GITHUB_WORKSPACE\dist"
          New-Item -ItemType Directory -Force $output | Out-Null

          foreach ($mode in @("user", "system")) {
            & $iscc `
              "/DMyAppVersion=$env:VERSION" `
              "/DSourceDir=$source" `
              "/DRepoRoot=$env:GITHUB_WORKSPACE" `
              "/DOutputDir=$output" `
              "/DArch=arm64" `
              "/DInstallMode=$mode" `
              "$env:GITHUB_WORKSPACE\windows\packaging\churchlib.iss"
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed for $mode installation" }
          }

      - name: Build ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/windows/arm64/runner/Release/*" `
            -DestinationPath "dist/${{ env.PKG_NAME }}-windows-arm64.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: dist/*
          if-no-files-found: error

# ============================================================
# LINUX
# ============================================================

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsqlite3-dev libstdc++-12-dev rpm patchelf fakeroot dpkg-dev

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
          arch: ${{ matrix.arch }}

      - name: Flutter diagnostics
        run: |
          flutter --version
          flutter doctor -v

      - name: Prepare
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter gen-l10n
          dart pub global activate flutter_distributor
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Build Linux application
        run: |
          flutter build linux --release -t "$ENTRY" --no-tree-shake-icons

      - name: Verify Linux build
        run: |
          BUNDLE="build/linux/${{ matrix.arch }}/release/bundle"
          if [ ! -d "$BUNDLE" ]; then
            find build/linux -maxdepth 5 -type d || true
            echo "Expected: $BUNDLE"
            exit 1
          fi
          ls -lah "$BUNDLE"

      - name: Build DEB
        run: |
          flutter_distributor package --platform linux --targets deb \
            --build-target "$ENTRY" --flutter-build-args=no-tree-shake-icons

      - name: Build RPM
        run: |
          flutter_distributor package --platform linux --targets rpm \
            --build-target "$ENTRY" --flutter-build-args=no-tree-shake-icons

      - name: Collect packages
        run: |
          mkdir -p out
          DEB=$(find dist -type f -name "*.deb" | head -1)
          RPM=$(find dist -type f -name "*.rpm" | head -1)
          [ -n "$DEB" ] || { echo "DEB not produced"; find dist -type f || true; exit 1; }
          [ -n "$RPM" ] || { echo "RPM not produced"; find dist -type f || true; exit 1; }
          cp "$DEB" "out/${PKG_NAME}-linux-${{ matrix.arch }}.deb"
          cp "$RPM" "out/${PKG_NAME}-linux-${{ matrix.arch }}.rpm"

      - name: Build tar.gz
        run: |
          BUNDLE="build/linux/${{ matrix.arch }}/release/bundle"
          mkdir -p stage
          cp -r "$BUNDLE" "stage/${APP_NAME}"
          tar -czf "out/${PKG_NAME}-linux-${{ matrix.arch }}.tar.gz" -C stage "${APP_NAME}"
          ls -lh out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

# ============================================================
# macOS
# ============================================================

  macos-x64:
    name: macOS Intel x64
    runs-on: macos-26-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
          arch: x64

      - name: Prepare
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          flutter gen-l10n

      - name: Build
        run: |
          flutter build macos --release -t "$ENTRY" --no-tree-shake-icons

      - name: Find app
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "No macOS app found"
            find build/macos/Build/Products/Release -maxdepth 2
            exit 1
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Verify architecture
        run: |
          BIN="$APP/Contents/MacOS/$(basename "$APP" .app)"
          file "$BIN"
          lipo -info "$BIN"

      - name: Create DMG
        run: |
          brew install create-dmg
          mkdir -p dist
          create-dmg \
            --volname "${APP_NAME}" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "$(basename "$APP")" 200 190 \
            --hide-extension "$(basename "$APP")" \
            --app-drop-link 600 185 \
            "dist/${PKG_NAME}-macos-x64.dmg" \
            "$APP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: dist/*
          if-no-files-found: error

